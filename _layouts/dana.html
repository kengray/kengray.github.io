<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dana — Fibre Crafts &amp; Sweet Lies and Lullabies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #221d17;
    --cream: #f6efe1;
    --cream-deep: #eadfc4;
    --indigo: #2c3a55;
    --indigo-deep: #1b2438;
    --berry: #9c3b3b;
    --gold: #c69a2f;
    --seam: repeating-linear-gradient(to bottom, var(--berry) 0 10px, transparent 10px 20px);
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    overflow-x: hidden;
  }
  h1, h2, h3{
    font-family: 'Fraunces', serif;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .eyebrow{
    font-family: 'Caveat', cursive;
    font-size: 1.5rem;
    color: var(--berry);
    display: block;
    margin-bottom: 0.25rem;
    transform: rotate(-1.5deg);
  }
  a{ color: inherit; }
  img{ max-width: 100%; display:block; }

  /* ---- pinked-edge zigzag divider, the site's signature motif ---- */
  .zigzag{
    width: 100%;
    height: 18px;
    line-height: 0;
  }
  .zigzag svg{ width: 100%; height: 18px; display:block; }
  .zigzag.flip{ transform: scaleY(-1); }

  /* ---- nav: styled like sewn-on fabric tabs ---- */
  header{
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--cream);
    border-bottom: 3px solid var(--ink);
  }
  nav{
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1.5rem;
  }
  .brandmark{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.4rem;
  }
  .tabs{
    display: flex;
    gap: 0.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .tabs a{
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--cream-deep);
    padding: 0.5rem 0.9rem 0.4rem;
    border: 2px solid var(--ink);
    border-bottom: none;
    clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .tabs a:hover{ background: var(--gold); transform: translateY(-2px); }

  section{ position: relative; }

  /* ---- hero ---- */
  .hero{
    max-width: 1000px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 3.5rem;
    text-align: center;
  }
  .hero h1{
    font-size: clamp(3rem, 9vw, 5.5rem);
    font-weight: 700;
  }
  .hero .tagline{
    font-family: 'Caveat', cursive;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    color: var(--berry);
    margin-top: 0.5rem;
    transform: rotate(-1deg);
  }
  .hero p.intro{
    max-width: 560px;
    margin: 1.5rem auto 0;
    font-size: 1.05rem;
  }
  .hero .ctas{
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn{
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    padding: 0.7rem 1.4rem;
    border: 2px solid var(--ink);
    border-radius: 999px;
    font-size: 0.9rem;
  }
  .btn.solid{ background: var(--ink); color: var(--cream); }
  .btn.solid:hover{ background: var(--berry); border-color: var(--berry); }
  .btn.line:hover{ background: var(--ink); color: var(--cream); }

  /* ---- crafts section ---- */
  .crafts{
    background: var(--cream-deep);
    padding: 4rem 1.5rem 4.5rem;
  }
  .section-inner{ max-width: 1000px; margin: 0 auto; }
  .section-head{ margin-bottom: 2.5rem; }
  .section-head h2{ font-size: clamp(2.1rem, 5vw, 3rem); font-weight: 700; }

  .patchwork{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  .patch{
    aspect-ratio: 1;
    border: 2px solid var(--ink);
    clip-path: polygon(
      0 4%, 4% 0, 96% 0, 100% 4%,
      100% 96%, 96% 100%, 4% 100%, 0 96%
    );
    display: flex;
    align-items: flex-end;
    padding: 0.6rem;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--cream);
    background-size: cover;
    background-position: center;
  }
  .patch span{
    background: rgba(34,29,23,0.55);
    padding: 0.2rem 0.5rem;
  }

  .craft-text{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
  }
  @media (max-width: 700px){
    .patchwork{ grid-template-columns: repeat(2, 1fr); }
    .craft-text{ grid-template-columns: 1fr; }
  }

  .craft-group{ margin-bottom: 3rem; }
  .craft-group:last-child{ margin-bottom: 0; }
  .craft-group h3{
    font-size: 1.3rem;
    margin-bottom: 0.9rem;
  }
  .craft-group .patchwork{ margin-bottom: 1rem; }
  .craft-group p{ max-width: 640px; }

  .violin-feature{
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .violin-feature img{
    width: 320px;
    max-width: 100%;
    border: 2px solid var(--ink);
    clip-path: polygon(0 4%, 4% 0, 96% 0, 100% 4%, 100% 96%, 96% 100%, 4% 100%, 0 96%);
  }
  .violin-feature p{ flex: 1; min-width: 240px; }

  /* ---- bio photo ---- */
  .bio-photo{
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--berry);
    margin: 1.75rem auto 0.5rem;
  }
  .bio-caption{
    font-family: 'Caveat', cursive;
    font-size: 1.15rem;
    color: var(--ink);
    text-align: center;
  }

  /* ---- music section ---- */
  .music{
    background: var(--indigo-deep);
    color: var(--cream);
    padding: 4.5rem 1.5rem 4.5rem;
  }
  .music .eyebrow{ color: var(--gold); }
  .music .section-head h2{ color: var(--cream); }
  .band-poster{
    border: 3px solid var(--gold);
    padding: 2.5rem 2rem;
    text-align: center;
    margin-bottom: 2.5rem;
    position: relative;
  }
  .band-poster h3{
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 700;
    color: var(--gold);
    line-height: 1.05;
  }
  .band-poster .sub{
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    margin-top: 0.4rem;
  }
  .band-grid{
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 2.5rem;
    margin-top: 2.5rem;
  }
  @media (max-width: 700px){ .band-grid{ grid-template-columns: 1fr; } }

  .lineup{ list-style: none; margin: 1rem 0 0; padding: 0; }
  .lineup li{
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed rgba(246,239,225,0.35);
    padding: 0.55rem 0;
    font-size: 0.95rem;
  }
  .lineup li span:last-child{ color: var(--gold); font-weight: 700; }

  .listen-box, .shows-box{
    border: 2px solid rgba(246,239,225,0.4);
    padding: 1.5rem;
    margin-bottom: 1.2rem;
  }
  .listen-box h4, .shows-box h4{
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    margin-bottom: 0.7rem;
    color: var(--gold);
  }
  .placeholder-note{
    font-size: 0.82rem;
    color: rgba(246,239,225,0.6);
    font-style: italic;
  }

  /* ---- bluegrass section ---- */
  .bluegrass{
    background: var(--cream);
    padding: 4.5rem 1.5rem 4.5rem;
  }
  .quote{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: clamp(1.4rem, 3.5vw, 1.9rem);
    max-width: 700px;
    line-height: 1.4;
    border-left: 4px solid var(--berry);
    padding-left: 1.5rem;
    margin: 2rem 0;
  }

  /* ---- footer ---- */
  footer{
    background: var(--ink);
    color: var(--cream);
    text-align: center;
    padding: 3rem 1.5rem 2.5rem;
  }
  footer h2{ font-size: 1.8rem; margin-bottom: 0.5rem; }
  .social{
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }
  .social a{
    text-decoration: none;
    border: 2px solid var(--cream);
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .social a:hover{ background: var(--cream); color: var(--ink); }
  footer .fine{
    margin-top: 2rem;
    font-size: 0.78rem;
    color: rgba(246,239,225,0.5);
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
  }
</style>
<script data-goatcounter="https://caledonia.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header>
  <nav>
    <span class="brandmark">Dana</span>
    <ul class="tabs">
      <li><a href="#crafts">Crafts</a></li>
      <li><a href="#music">Music</a></li>
      <li><a href="#bluegrass">Bluegrass</a></li>
      <li><a href="#contact">Say hello</a></li>
    </ul>
  </nav>
</header>

{{ content }}

<footer id="contact">
  <h2>Say hello</h2>
  <p>{{ page.contact_intro }}</p>
  <div class="social">
    {% for link in page.social_links %}
    <a href="{{ link.url }}">{{ link.label }}</a>
    {% endfor %}
  </div>
  <p class="fine">Dana &middot; built with a needle in one hand and a plectrum in the other &middot; v{{ site.version }}</p>
</footer>

</body>
</html>
